<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastel Shop 로그인</title>
    <link rel="stylesheet" href="login.css"> <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <div class="login-container">
        <div class="login-box">
            <h1 class="logo-title">Pastel Shop</h1>
            <p class="subtitle">관리자 / 회원 로그인</p>

            <form action="admin.html" method="get" class="login-form">
                
                <div class="input-group">
                    <label for="username"><i class="fas fa-user"></i> 아이디</label>
                    <input type="text" id="username" name="username" placeholder="아이디를 입력하세요" required>
                </div>

                <div class="input-group">
                    <label for="password"><i class="fas fa-lock"></i> 비밀번호</label>
                    <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
                </div>

                <div class="options-group">
                    <label>
                        <input type="checkbox" name="remember"> 아이디 저장
                    </label>
                    <a href="#" class="find-link">아이디/비밀번호 찾기</a>
                </div>

                <button type="submit" class="login-btn">로그인</button>
            </form>

            <div class="extra-links">
                <a href="#">회원가입</a> | 
                <a href="index.html">메인으로 돌아가기</a>
            </div>
        </div>
    </div>

</body>
</html>
